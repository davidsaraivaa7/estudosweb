<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petiscaria Nordestina | Cardápio</title>
<meta name="description" content="Confira o cardápio da Petiscaria Nordestina: tira-gostos, cervejas e doses com preços atualizados.">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Petiscaria Nordestina | Cardápio">
<meta property="og:description" content="Tira-gostos, cervejas e doses. Veja o cardápio completo e os preços.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --surface:#0d0d0d;
  --line:#262626;
  --text:#f5f5f5;
  --muted:#a3a3a3;
  --neon:#ff5e00;
  --neon-glow:rgba(255,94,0,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;
}
main{max-width:1100px;margin:0 auto;padding:40px 20px 64px}
h1{
  margin:0 0 32px;font-size:clamp(2.6rem,9vw,5rem);font-weight:800;
  line-height:.95;letter-spacing:-.03em;color:var(--neon);
  text-shadow:0 0 28px var(--neon-glow);
}
.abas{display:flex;gap:10px;margin:0 0 28px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{
  flex:0 0 auto;font:inherit;font-weight:600;font-size:1.05rem;cursor:pointer;
  padding:10px 22px;border-radius:999px;background:transparent;color:var(--neon);
  border:1.5px solid var(--neon);
}
.aba[aria-selected="true"]{background:var(--neon);color:#000;box-shadow:0 0 22px var(--neon-glow)}
.aba:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.item{
  display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;
}
.foto{
  aspect-ratio:4/3;display:grid;place-items:center;
  background:#000;border-bottom:1px dashed var(--neon);
  color:var(--neon);font-size:.85rem;font-weight:600;
}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto svg{width:34px;height:34px;display:block;margin:0 auto 6px}
.corpo{display:flex;flex-direction:column;gap:6px;padding:16px 16px 18px;flex:1}
.nome{margin:0;font-size:1.2rem;font-weight:600;line-height:1.2}
.info{margin:0;color:var(--muted);font-size:.95rem;flex:1}
.preco{
  align-self:flex-start;margin-top:10px;padding:6px 14px;border-radius:999px;
  background:var(--neon);color:#000;font-weight:800;font-size:1.15rem;
  box-shadow:0 0 22px var(--neon-glow);font-variant-numeric:tabular-nums;
}

/* Botões flutuantes (WhatsApp e Instagram) */
.flutuantes{
  position:fixed;
  right:calc(20px + env(safe-area-inset-right,0px));
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  z-index:50;display:flex;flex-direction:column;gap:14px;
}
.flutuantes a{
  width:60px;height:60px;border-radius:50%;display:grid;place-items:center;
  transition:transform .15s ease,box-shadow .15s ease;
}
.flutuantes svg{width:30px;height:30px;display:block}
.flutuantes a:focus-visible{outline:2px solid var(--text);outline-offset:4px}
.insta{
  background:var(--neon);color:#000;
  box-shadow:0 0 26px var(--neon-glow),0 6px 18px rgba(0,0,0,.6);
}
.zap{
  background:#000;color:var(--neon);border:2px solid var(--neon);
  box-shadow:0 0 22px var(--neon-glow),0 6px 18px rgba(0,0,0,.6);
}
.flutuantes a:hover{transform:scale(1.08)}
@media (prefers-reduced-motion:reduce){.flutuantes a{transition:none}.flutuantes a:hover{transform:none}}

.aviso a{color:var(--neon);text-decoration:underline}
.aviso{
  margin:40px 0 0;padding-top:20px;border-top:1px solid var(--line);
  color:var(--muted);font-size:.9rem;text-align:center;
}

@media (max-width:520px){
  .grid{grid-template-columns:1fr}
  main{padding-bottom:170px}
}
</style>
</head>
<body>
<main>
  <h1>Petiscaria Nordestina</h1>
  <div class="abas" role="tablist" aria-label="Categorias">
    <button class="aba" role="tab" data-cat="tira-gosto" aria-selected="true">Tira-gosto</button>
    <button class="aba" role="tab" data-cat="jantinhas" aria-selected="false">Jantinhas</button>
    <button class="aba" role="tab" data-cat="cervejas" aria-selected="false">Cervejas</button>
    <button class="aba" role="tab" data-cat="doses" aria-selected="false">Doses</button>
  </div>
  <div class="grid" id="grid" role="tabpanel"></div>
  <p class="aviso">Venda e consumo de bebida alcoólica proibidos para menores de 18 anos. Beba com moderação.<br>
    Desenvolvido por <a href="https://www.instagram.com/davidsaraivaa._/" target="_blank" rel="noopener noreferrer" aria-label="Abrir o Instagram do desenvolvedor">David Saraiva</a>, estudante de Análise e Desenvolvimento de Sistemas, 2026.</p>
</main>


<div class="flutuantes">
  <a class="zap" href="https://wa.me/55879996454295?text=Ol%C3%A1!%20Vim%20pelo%20card%C3%A1pio%20digital." target="_blank" rel="noopener noreferrer" aria-label="Chamar no WhatsApp">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>
      <path d="M15.6 14.2v1a.7.7 0 0 1-.8.7 6.9 6.9 0 0 1-3-1.1 6.8 6.8 0 0 1-2.1-2.1 6.9 6.9 0 0 1-1.1-3 .7.7 0 0 1 .7-.8h1a.7.7 0 0 1 .7.6c.1.4.2.7.3 1a.7.7 0 0 1-.2.7l-.4.4a5.5 5.5 0 0 0 2.1 2.1l.4-.4a.7.7 0 0 1 .7-.2c.3.1.6.2 1 .3a.7.7 0 0 1 .7.7z" stroke-width="1.4"/>
    </svg>
  </a>
  <a class="insta" href="https://www.instagram.com/petiscaria_nordestina26/" target="_blank" rel="noopener noreferrer" aria-label="Abrir o Instagram do estabelecimento">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/>
    </svg>
  </a>
</div>

<script>
// Foto: coloque só o caminho da imagem, sem tag <img>. Ex.: foto:"fotos/heineken600.jpg" (pasta "fotos" ao lado deste arquivo, sem espaços no nome).
const produtos = [
  {cat:"tira-gosto", nome:"Calabresa Acebolada", info:"Porção de 400 g com cebola e pão.", preco:28, foto:""},
  {cat:"tira-gosto", nome:"Batata Frita", info:"Porção de 400 g com cheddar e bacon.", preco:26, foto:""},
  {cat:"tira-gosto", nome:"Isca de Peixe", info:"Tilápia empanada com molho tártaro.", preco:42, foto:""},
  {cat:"tira-gosto", nome:"Torresmo", info:"Porção de 300 g, sequinho e crocante.", preco:24, foto:""},
  {cat:"tira-gosto", nome:"Mandioca Frita", info:"Porção de 400 g com molho da casa.", preco:22, foto:""},
  {cat:"tira-gosto", nome:"Frango a Passarinho", info:"Porção de 500 g temperada com alho.", preco:36, foto:""},
  {cat:"cervejas", nome:"Cerveja Heineken 600 ml", info:"Garrafa bem gelada.", preco:14, foto:"./assets/BEBIDAS/heineken600.jpg"},
  {cat:"cervejas", nome:"Cerveja Long Neck", info:"355 ml. Consulte as marcas disponíveis.", preco:9, foto:""},
  {cat:"cervejas", nome:"Cerveja Artesanal IPA", info:"500 ml, lúpulo marcante e final amargo.", preco:24, foto:""},
  {cat:"cervejas", nome:"Cerveja Sem Álcool", info:"355 ml, bem gelada.", preco:8, foto:""},
  {cat:"doses", nome:"Dose de Cachaça", info:"50 ml. Pergunte pelos rótulos da casa.", preco:8, foto:""},
  {cat:"doses", nome:"Dose de Whisky", info:"50 ml, servida com gelo.", preco:18, foto:""},
  {cat:"doses", nome:"Dose de Vodka", info:"50 ml, servida com gelo e limão.", preco:12, foto:""},
  {cat:"doses", nome:"Dose de Tequila", info:"50 ml, com sal e limão.", preco:16, foto:""},
  {cat:"doses", nome:"Dose de Gin", info:"50 ml, com tônica e rodela de limão.", preco:20, foto:""}
];
const icone = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const brl = v => "R$ " + v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(cat){
  const lista = produtos.filter(p => p.cat === cat);
  if(!lista.length){ document.getElementById("grid").innerHTML = '<p style="color:var(--muted);grid-column:1/-1">Em breve novidades nesta categoria.</p>'; return; }
  document.getElementById("grid").innerHTML = lista.map(p => `
  <article class="item">
    <div class="foto">${p.foto ? `<img src="${p.foto}" alt="${esc(p.nome)}">` : `<span>${icone}Foto do produto</span>`}</div>
    <div class="corpo">
      <h2 class="nome">${esc(p.nome)}</h2>
      <p class="info">${esc(p.info)}</p>
      <span class="preco">${brl(p.preco)}</span>
    </div>
  </article>`).join("");
}
document.querySelectorAll(".aba").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".aba").forEach(x => x.setAttribute("aria-selected", x === b));
  render(b.dataset.cat);
}));
render("tira-gosto");
</script>
</body>
</html>
